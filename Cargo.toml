[package]
name = "sha3-kernel-hasher"
version = "0.3.0"
edition = "2021"
rust-version = "1.89"
authors = ["Sebastian Friedrich Nestler <sebastian.nestler@tutanota.de>"]
description = "Pure-Rust SHA3-512 (FIPS 202), full Keccak-f[1600] permutation, no_std+alloc dual-mode for kernel drivers. Passes NIST CAVP test vectors, cross-validated vs RustCrypto sha3. Real AVX-512x8 batch hashing (~5.5x, hash_many); single-hash SIMD is opt-in, not a speedup — see README 5.1."
license = "MIT OR Apache-2.0"
repository = "https://github.com/Basty-devel/sha3-kernel-hasher"
homepage = "https://github.com/Basty-devel/sha3-kernel-hasher"
documentation = "https://docs.rs/sha3-kernel-hasher"
keywords = ["sha3", "sha3-512", "keccak", "no-std", "kernel"]
categories = ["cryptography", "no-std::no-alloc"]
readme = "README.md"
exclude = ["target/", ".git/", "examples/"]

[lib]
name = "sha3_kernel_hasher"
# Plain rlib: there is no #[no_mangle]/extern "C" export anywhere in this
# crate, so there's nothing for a cdylib artifact to expose. `cdylib` here
# was also masking a real bug — it made `cargo check --features kernel`
# (no_std) require a panic_handler/global allocator this crate doesn't
# provide, which is the consuming kernel driver's job, not this library's.

[features]
default = ["std"]
std = []
no_std = []
kernel = ["no_std"]
serde = ["dep:serde"]
benchmarks = ["dep:criterion"]

[dependencies]
# Optional serde support
serde = { version = "1.0", features = ["derive"], optional = true }
serde_json = { version = "1.0", optional = true }
criterion = { version = "0.5", features = ["html_reports"], optional = true }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
rand = "0.8"
hex = "0.4"
sha3 = "0.10"
digest = "0.10"

# SIMD intrinsics are available via std::arch natively, no external crate needed


[[bench]]
name = "sha3_bench"
harness = false

[package.metadata.docs.rs]
all-features = true
